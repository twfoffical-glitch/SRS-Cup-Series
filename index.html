<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratus Racing Series (SRS) — NASCAR League</title>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08070b;
            --surface: #121018;
            --surface-card: #191622;
            --gold: #f5c518;
            --gold-hover: #ffd700;
            --purple: #8a2be2;
            --purple-glow: rgba(138, 43, 226, 0.3);
            --white: #ffffff;
            --muted: #9e98b0;
            --border: rgba(245, 197, 24, 0.15);
            --border-subtle: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Barlow', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header & Navigation */
        header {
            background: linear-gradient(135deg, #0d0a14 0%, #1a1026 100%);
            border-bottom: 2px solid var(--gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-badge {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, var(--gold), #c99a0e);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 900;
            font-size: 24px;
            color: var(--bg);
            letter-spacing: -1px;
            box-shadow: 0 0 15px rgba(245, 197, 24, 0.4);
            border: 1px solid #fff;
        }

        .brand-text h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .brand-text h1 span {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(245, 197, 24, 0.3);
        }

        .brand-text p {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 2px;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            color: var(--white);
            background: rgba(255,255,255,0.05);
        }

        .nav-btn.active {
            color: var(--bg);
            background: var(--gold);
            box-shadow: 0 0 12px rgba(245, 197, 24, 0.4);
        }

        /* Main Container */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 32px;
            flex: 1;
            width: 100%;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Section Titles */
        .section-header {
            margin-bottom: 24px;
            border-left: 4px solid var(--purple);
            padding-left: 16px;
        }

        .section-header h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 32px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .section-header p {
            color: var(--muted);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Grid Layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 32px;
        }

        @media(max-width: 1024px) {
            .grid-2 { grid-template-columns: 1fr; }
        }

        /* Cards & Tables */
        .card {
            background: var(--surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        }

        .card-header {
            background: var(--surface-card);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h3 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--gold);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: rgba(18, 16, 24, 0.9);
            color: var(--muted);
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 14px 20px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 15px;
        }

        tr:hover td {
            background: rgba(138, 43, 226, 0.05);
        }

        .pos-cell {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            font-size: 18px;
            color: var(--gold);
            width: 80px;
        }

        /* Home Hero Banner */
        .hero {
            background: linear-gradient(135deg, rgba(18,16,24,0.9), rgba(138,43,226,0.15)), url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="%23121018" width="100" height="100"/><path d="M0 0l100 100M100 0L0 100" stroke="%23191622" stroke-width="1"/></svg>');
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 60px 48px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
        }

        .hero::after {
            content: '';
            position: absolute;
            right: -50px;
            bottom: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--purple-glow), transparent 70%);
            border-radius: 50%;
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 650px;
        }

        .hero h2 {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 48px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1.05;
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .hero h2 span {
            color: var(--gold);
        }

        .hero p {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn-primary {
            background: var(--gold);
            color: var(--bg);
            border: none;
            padding: 14px 32px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(245, 197, 24, 0.3);
        }

        .btn-primary:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 197, 24, 0.5);
        }

        /* Schedule List */
        .schedule-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .race-card {
            background: var(--surface);
            border: 1px solid
